image: registry.ci.infra.lan:5000/project-2:client-QA

stages:
  - qa
  - deploy

variables:
  IMAGE_NAME: hcr.technet.howest.be/adria-client-group-08:latest

before_script:
  - npm ci

sonarqube_scan:
  stage: qa
  script:
    - npm run sonar-ci
  only:
    - main

build_and_push:
  stage: deploy
  image: docker:latest
  services:
    - docker:dindS
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build --build-arg BUILD_ENV=dev -t $IMAGE_NAME .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin hcr.technet.howest.be
    - docker push $IMAGE_NAME
  only:
    - main
  tags:
    - docker
